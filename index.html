<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白地図クイズ</title>
<style>
  :root {
    --bg: #F4F5F6; --surface: #FFFFFF; --text: #1D2125; --muted: #5B636B; --line: #D5D9DD;
    --accent: #F2C230; --sea: #DCE8F0; --land: #FFFFFF; --border: #6B747C;
    --ok: #4CAF7A; --ng: #E0675F; --label-bg: #1D2125; --label-text: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E2226; --surface: #2A2F34; --text: #ECEEF0; --muted: #A3ABB3; --line: #3B4248;
      --accent: #F2C230; --sea: #1B2A36; --land: #3A4148; --border: #9AA3AB;
      --ok: #3FA36B; --ng: #D65A52; --label-bg: #F2C230; --label-text: #1D2125;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
  header { border-left: 6px solid var(--accent); padding-left: 14px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  /* 地域一覧 */
  .group { margin-bottom: 24px; }
  .group h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card {
    display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; color: var(--text); text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card strong { display: block; font-size: 1.05rem; }
  .card span { font-size: 0.85rem; color: var(--muted); }
  .upcoming { font-size: 0.85rem; color: var(--muted); line-height: 1.7; }

  /* クイズ */
  .back { display: inline-block; margin-bottom: 12px; color: var(--muted); font-size: 0.9rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .map { background: var(--sea); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .map svg { display: block; width: 100%; height: auto; }
  .country { fill: var(--land); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; transition: fill .2s; }
  .country.ok { fill: var(--ok); }
  .country.ng { fill: var(--ng); }
  .leader { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 2; }
  .tag circle { fill: var(--label-bg); }
  .tag text { fill: var(--label-text); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 1rem; }
  .row { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row .key {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--label-bg); color: var(--label-text);
    font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .row input {
    font: inherit; font-size: 16px; width: 100%; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--text);
  }
  .row input.ok { border-color: var(--ok); }
  .row input.ng { border-color: var(--ng); }
  .row .answer { grid-column: 2; font-size: 0.8rem; color: var(--ng); margin-top: -2px; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; font: inherit; font-weight: 700; padding: 10px; border: 0; border-radius: 6px;
    background: var(--accent); color: #1D2125; cursor: pointer;
  }
  button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .score { margin-top: 12px; font-weight: 700; min-height: 1.5em; }
  .note { margin-top: 14px; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>

<main id="app"></main>

  const UPCOMING = "ヨーロッパ（西・北・南・東）、南米、アフリカ、中東、北米＋中米、カリブ、オセアニア";

  const app = document.getElementById("app");
  const svgNS = "http://www.w3.org/2000/svg";

  function normalize(s) { return s.trim().toLowerCase().replace(/[\s・\-]/g, ""); }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // ---------- 地域一覧 ----------
  function renderHome() {
    document.title = "白地図クイズ";
    const groups = {};
    REGIONS.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
    let html = '<header><h1>白地図クイズ</h1><p>地域を選ぶと白地図が表示されます。記号に当てはまる国・地域の名前を答えてください。</p></header>';
    for (const g in groups) {
      html += '<section class="group"><h2>' + esc(g) + '</h2><div class="cards">';
      groups[g].forEach(r => {
        html += '<a class="card" href="#' + r.id + '"><strong>' + esc(r.name) + '</strong><span>' + Object.keys(r.countries).length + 'の国・地域</span></a>';
      });
      html += '</div></section>';
    }
    html += '<p class="upcoming">今後追加予定：' + esc(UPCOMING) + '</p>';
    app.innerHTML = html;
  }

  // ---------- クイズ ----------
  function renderQuiz(region) {
    document.title = region.name + " | 白地図クイズ";
    app.innerHTML =
      '<a class="back" href="#">← 地域一覧へ</a>' +
      '<header><h1>' + esc(region.name) + '</h1><p>地図の記号に当てはまる国・地域の名前を入力して、「答え合わせ」を押してください。</p></header>' +
      '<div class="layout">' +
        '<div class="map"><svg id="map" role="img" aria-label="' + esc(region.name) + 'の白地図"></svg></div>' +
        '<div class="panel"><h2>回答欄</h2><div id="rows"></div>' +
          '<div class="buttons"><button id="check" type="button">答え合わせ</button><button id="reset" type="button" class="secondary">もう一度</button></div>' +
          '<div class="score" id="score"></div>' +
          '<p class="note">国の形は手作業で描いた粗い簡略図です。</p>' +
        '</div>' +
      '</div>';

    const svg = document.getElementById("map");
    const rowsEl = document.getElementById("rows");
    const scoreEl = document.getElementById("score");
    const codes = Object.keys(region.countries);
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".slice(0, codes.length).split("");
    svg.setAttribute("viewBox", "0 0 " + region.w + " " + region.h);
    let assign = {};   // 記号 → 国コード

    function build() {
      svg.innerHTML = ""; rowsEl.innerHTML = ""; scoreEl.textContent = "";
      const shuffled = shuffle(codes);
      assign = {};
      letters.forEach((L, i) => { assign[L] = shuffled[i]; });

      for (const cc of codes) {
        svg.appendChild(el("path", { d: region.countries[cc].d, class: "country", id: "c-" + cc }));
      }
      letters.forEach(L => {
        const c = region.countries[assign[L]];
        const [x, y] = c.label;
        if (c.anchor) svg.appendChild(el("line", { x1: c.anchor[0], y1: c.anchor[1], x2: x, y2: y, class: "leader" }));
        const g = el("g", { class: "tag" });
        g.appendChild(el("circle", { cx: x, cy: y, r: 11 }));
        const t = el("text", { x: x, y: y }); t.textContent = L; g.appendChild(t);
        svg.appendChild(g);
      });
      letters.forEach(L => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="key">' + L + '</span><input type="text" autocomplete="off" autocapitalize="off" aria-label="' + L + ' の国・地域名"><span class="answer"></span>';
        rowsEl.appendChild(row);
      });
    }

    function check() {
      let correct = 0;
      [...rowsEl.children].forEach((row, i) => {
        const cc = assign[letters[i]];
        const input = row.querySelector("input");
        const ok = NAMES[cc][1].some(n => normalize(n) === normalize(input.value));
        input.classList.toggle("ok", ok);
        input.classList.toggle("ng", !ok);
        row.querySelector(".answer").textContent = ok ? "" : "正解：" + NAMES[cc][0];
        const shape = document.getElementById("c-" + cc);
        shape.classList.toggle("ok", ok);
        shape.classList.toggle("ng", !ok);
        if (ok) correct++;
      });
      scoreEl.textContent = letters.length + "問中 " + correct + "問正解";
    }

    document.getElementById("check").addEventListener("click", check);
    document.getElementById("reset").addEventListener("click", build);
    build();
  }

  // ---------- 画面の切り替え（URL の # で地域を指定） ----------
  function route() {
    const id = location.hash.slice(1);
    const region = REGIONS.find(r => r.id === id);
    if (region) renderQuiz(region); else renderHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
